<title>Rengøringstimer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, the bill on top, the form under it, the log of visits below */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --ink: #131A2E;
  --muted: #5A6480;
  --line: #DCE1EB;
  --accent: #2347A6;
  --on-accent: #FFFFFF;
  --accent-soft: #E7ECF8;
  --hero: #1F3F96;
  --hero-ink: #FFFFFF;
  --hero-muted: #C7D3F4;
  --ok: #1D7149;
  --ok-soft: #E1F2E8;
  --warn: #8A5300;
  --warn-soft: #FBEFD6;
  --danger: #B42318;
  --danger-soft: #FBE6E4;
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1220; --surface: #151C2E; --ink: #E7EBF5; --muted: #9AA4BF; --line: #263049;
    --accent: #9DB3F2; --on-accent: #0D1220; --accent-soft: #1C2747;
    --hero: #1C3270; --hero-ink: #F3F6FF; --hero-muted: #B4C2EC;
    --ok: #7FD3A6; --ok-soft: #12301F; --warn: #F2C374; --warn-soft: #33270F;
    --danger: #F19C94; --danger-soft: #3A1A18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1220; --surface: #151C2E; --ink: #E7EBF5; --muted: #9AA4BF; --line: #263049;
  --accent: #9DB3F2; --on-accent: #0D1220; --accent-soft: #1C2747;
  --hero: #1C3270; --hero-ink: #F3F6FF; --hero-muted: #B4C2EC;
  --ok: #7FD3A6; --ok-soft: #12301F; --warn: #F2C374; --warn-soft: #33270F;
  --danger: #F19C94; --danger-soft: #3A1A18;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
p { margin: 0; }
h1, h2 { margin: 0; font-family: var(--display); text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 34rem; margin: 0 auto; display: grid; gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
.sync { font-size: 0.8rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.sync[data-tone="ok"]::before { background: var(--ok); }
.sync[data-tone="warn"]::before { background: var(--warn); }

/* The bill */
.bill { background: var(--hero); color: var(--hero-ink); border-radius: 20px; padding: 20px; display: grid; gap: 6px; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--hero-muted); }
.amount { font-family: var(--display); font-size: clamp(2.6rem, 12vw, 3.6rem); font-weight: 700; line-height: 1.02; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.amount .cur { font-size: 0.45em; font-weight: 600; color: var(--hero-muted); letter-spacing: 0; }
.calc { color: var(--hero-muted); font-variant-numeric: tabular-nums; }
.open-note { font-size: 0.85rem; color: var(--hero-muted); }
.bill-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn-hero { background: var(--hero-ink); color: var(--hero); border: 2px solid var(--hero-ink); border-radius: 999px; padding: 0 18px; min-height: 44px; font: inherit; font-weight: 600; cursor: pointer; }
.btn-hero.armed { background: transparent; color: var(--hero-ink); }
.btn-hero:disabled { opacity: 0.45; cursor: default; }
.bill :focus-visible { outline-color: var(--hero-ink); }

/* Rates */
.rates { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { grid-column: 1 / -1; font-size: 0.8rem; color: var(--muted); }

/* Fields */
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.lbl, .field > label { font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
.lblrow { display: flex; justify-content: space-between; align-items: center; gap: 4px; min-height: 24px; }
input {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  min-height: 46px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums;
}
input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; display: block; }
input::-webkit-date-and-time-value { text-align: left; }
input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input[aria-invalid="true"] { border-color: var(--danger); }
.unit { position: relative; }
.unit input { padding-right: 3.8rem; }
.unit span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.85rem; pointer-events: none; }

/* Form card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h2 { font-size: 1.1rem; font-weight: 600; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr 4.75rem; gap: 10px; }
.field-date { grid-column: 1 / -1; }
.now { background: none; border: 0; color: var(--accent); font: inherit; font-size: 0.78rem; font-weight: 600; padding: 2px 4px; cursor: pointer; border-radius: 6px; }
.preview { font-variant-numeric: tabular-nums; background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; }
.preview:empty { display: none; }
.error { color: var(--danger); font-size: 0.88rem; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 44px; padding: 0 18px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:disabled { opacity: 0.5; cursor: default; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.danger { background: transparent; color: var(--danger); margin-left: auto; }
.btn.danger.armed { background: var(--danger-soft); }

/* Log */
.log { display: grid; gap: 10px; }
.log h2 { font-size: 1.05rem; font-weight: 600; }
.log-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.log-head .count { font-size: 0.82rem; color: var(--muted); }
.visits { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.visit-li { display: flex; align-items: center; border-top: 1px solid var(--line); }
.visit-li:first-child { border-top: 0; }
.visit { flex: 1; min-width: 0; display: grid; grid-template-columns: 3rem 1fr auto; gap: 12px; align-items: center; text-align: left; background: none; border: 0; padding: 12px 14px; font: inherit; color: inherit; cursor: pointer; }
.visit:hover { background: var(--accent-soft); }
.visit.editing { background: var(--accent-soft); }
.v-date { display: grid; line-height: 1.15; }
.v-wd { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.v-dm { font-weight: 600; font-variant-numeric: tabular-nums; }
.v-mid { display: grid; gap: 2px; min-width: 0; justify-items: start; }
.v-time { font-variant-numeric: tabular-nums; }
.v-calc { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.v-amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.quick { margin-right: 12px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; color: var(--muted); font-size: 0.9rem; }

.batches { display: grid; gap: 8px; }
.batch { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.batch summary { list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 14px; cursor: pointer; }
.batch summary::-webkit-details-marker { display: none; }
.b-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.b-range { font-weight: 600; font-variant-numeric: tabular-nums; }
.b-sub { grid-column: 1; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.b-amt { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.b-amt::after { content: ""; display: inline-block; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin-left: 10px; vertical-align: 3px; }
.batch[open] .b-amt::after { transform: rotate(-135deg); vertical-align: -1px; }
.batch .visits { border: 0; border-top: 1px solid var(--line); border-radius: 0; }
.b-foot { padding: 6px 14px 10px; border-top: 1px solid var(--line); }
.linkbtn { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; font-size: 0.88rem; cursor: pointer; padding: 6px 0; min-height: 36px; }
.linkbtn.armed { color: var(--danger); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 999px; font-weight: 500; font-size: 0.92rem; z-index: 20;
}

@media (max-width: 360px) {
  .form-grid { grid-template-columns: 1fr 1fr; }
  .rates { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .b-amt::after { transition: transform 0.15s ease; }
}
</style>

<main class="wrap">
  <header class="top">
    <h1>Rengøring</h1>
    <span id="sync" class="sync">Starter…</span>
  </header>

  <section class="bill" aria-labelledby="bill-h">
    <p class="eyebrow" id="bill-h">Til betaling</p>
    <p class="amount"><span id="due-amount">0</span> <span class="cur">kr</span></p>
    <p class="calc" id="due-calc">Ingen ubetalte timer</p>
    <p id="open-note" class="open-note" hidden></p>
    <div class="bill-actions">
      <button id="pay-btn" class="btn-hero" type="button" disabled>Marker som betalt</button>
    </div>
  </section>

  <section class="rates" aria-label="Satser">
    <div class="field">
      <label for="rate">Timepris</label>
      <div class="unit"><input id="rate" inputmode="decimal" autocomplete="off" value="100"><span>kr/time</span></div>
    </div>
    <div class="field">
      <label for="extra-default">Ekstra pr. gang</label>
      <div class="unit"><input id="extra-default" inputmode="decimal" autocomplete="off" value="1"><span>timer</span></div>
    </div>
    <p class="hint">Timeprisen gælder alt, der ikke er betalt endnu. Ekstra timer lægges oven i hver ny gang.</p>
  </section>

  <section class="card" aria-labelledby="form-title">
    <div class="card-head">
      <h2 id="form-title">Ny gang</h2>
    </div>
    <form id="visit-form" novalidate>
      <div class="form-grid">
        <div class="field field-date">
          <label for="f-date">Dato</label>
          <input id="f-date" type="date">
        </div>
        <div class="field">
          <div class="lblrow"><label class="lbl" for="f-start">Kom</label><button type="button" class="now" data-now="f-start">Nu</button></div>
          <input id="f-start" type="time">
        </div>
        <div class="field">
          <div class="lblrow"><label class="lbl" for="f-end">Gik</label><button type="button" class="now" data-now="f-end">Nu</button></div>
          <input id="f-end" type="time">
        </div>
        <div class="field">
          <div class="lblrow"><label class="lbl" for="f-extra">Ekstra</label></div>
          <input id="f-extra" inputmode="decimal" autocomplete="off">
        </div>
      </div>
    </form>
    <p id="f-preview" class="preview" aria-live="polite"></p>
    <p id="f-error" class="error" role="alert" hidden></p>
    <div class="actions">
      <button type="submit" form="visit-form" id="f-submit" class="btn primary" disabled>Tilføj</button>
      <button type="button" id="f-cancel" class="btn ghost" hidden>Annuller</button>
      <button type="button" id="f-delete" class="btn danger" hidden>Slet</button>
    </div>
  </section>

  <section class="log" aria-labelledby="open-h">
    <div class="log-head"><h2 id="open-h">Ikke betalt</h2><span id="open-count" class="count"></span></div>
    <ul id="open-list" class="visits" hidden></ul>
    <p id="open-empty" class="empty">Henter dine timer…</p>
  </section>

  <section class="log" id="paid-section" aria-labelledby="paid-h" hidden>
    <div class="log-head"><h2 id="paid-h">Betalt</h2><span id="paid-count" class="count"></span></div>
    <div id="paid-list" class="batches"></div>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  "use strict";

  var DAYS = ["søn", "man", "tir", "ons", "tor", "fre", "lør"];
  var DEFAULTS = { rate: 100, extra: 1 };
  var NF = new Intl.NumberFormat("da-DK", { maximumFractionDigits: 2 });
  var fmt = function (n) { return NF.format(Math.round(n * 100) / 100); };
  var plain = function (n) { return String(n).replace(".", ","); };
  var $ = function (id) { return document.getElementById(id); };

  var settings = { rate: DEFAULTS.rate, extra: DEFAULTS.extra };
  var visits = [];
  var backend = null;
  var loaded = false;
  var editingId = null;
  var openBatches = new Set();
  var payArmed = false, payTimer = null;
  var undoArmed = null, undoTimer = null;
  var delArmed = false, delTimer = null;

  /* ---------- helpers ---------- */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function nowHM() {
    var d = new Date();
    var m = Math.round((d.getHours() * 60 + d.getMinutes()) / 5) * 5;
    if (m >= 1440) m = 1435;
    return pad(Math.floor(m / 60)) + ":" + pad(m % 60);
  }
  function toMin(t) {
    if (typeof t !== "string" || !/^\d{1,2}:\d{2}$/.test(t)) return null;
    var p = t.split(":");
    return Number(p[0]) * 60 + Number(p[1]);
  }
  function parseNum(s) {
    var str = String(s == null ? "" : s).trim().replace(/\s/g, "").replace(",", ".");
    if (str === "") return NaN;
    var n = Number(str);
    return Number.isFinite(n) ? n : NaN;
  }
  function validNum(v, fallback) { var n = Number(v); return Number.isFinite(n) && n >= 0 ? n : fallback; }

  function worked(v) {
    var s = toMin(v.start), e = toMin(v.end);
    if (s == null || e == null || e <= s) return null;
    return (e - s) / 60;
  }
  function extraOf(v) { return validNum(v.extra, 0); }
  function billed(v) { var w = worked(v); return w == null ? null : w + extraOf(v); }
  function rateOf(v) { return v.paid && Number.isFinite(Number(v.paidRate)) && v.paidRate !== null ? Number(v.paidRate) : settings.rate; }
  function amountOf(v) { var b = billed(v); return b == null ? null : b * rateOf(v); }
  function isValidDate(iso) { return typeof iso === "string" && /^\d{4}-\d{2}-\d{2}$/.test(iso); }
  function dateParts(iso) {
    var p = iso.split("-").map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2]);
    return { y: p[0], m: p[1], d: p[2], wd: DAYS[dt.getDay()] };
  }
  function shortDate(iso) {
    var p = dateParts(iso);
    return p.d + "/" + p.m + (p.y !== new Date().getFullYear() ? " " + p.y : "");
  }
  function byNewest(a, b) { return (b.date + (b.start || "")).localeCompare(a.date + (a.start || "")); }
  function gange(n) { return n === 1 ? "1 gang" : n + " gange"; }
  function calcText(v) {
    var w = worked(v);
    if (w == null) return "";
    var x = extraOf(v);
    return x ? fmt(w) + " t + " + fmt(x) + " = " + fmt(w + x) + " t" : fmt(w) + " t";
  }

  function setSync(text, tone) {
    var s = $("sync");
    s.textContent = text;
    if (tone) s.setAttribute("data-tone", tone); else s.removeAttribute("data-tone");
  }
  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2800);
  }
  function writeError(e) {
    var code = e && e.code;
    if (code === "invalid_argument") toast("Kunne ikke gemme. Du har måske kun adgang til at se siden.");
    else if (code === "quota_exceeded") toast("Der er ikke plads til flere. Slet nogle gamle gange.");
    else toast("Kunne ikke gemme. Prøv igen om lidt.");
  }

  /* ---------- storage: shared database when available, else this browser ---------- */
  function withRetry(fn) {
    return fn().catch(function (e) {
      if (e && e.code === "unavailable") {
        return new Promise(function (r) { setTimeout(r, 600 + Math.random() * 900); }).then(fn);
      }
      throw e;
    });
  }

  function dbBackend(db) {
    var confirmed = false;
    var timer = setTimeout(function () {
      if (!confirmed) setSync(loaded ? "Viser måske ikke de nyeste timer" : "Kan ikke hente dine timer lige nu", "warn");
      if (!loaded) { $("open-empty").textContent = "Kan ikke hente dine timer lige nu. Tjek din forbindelse."; }
    }, 10000);
    return {
      kind: "db",
      start: function () {
        db.collection("visits").onSnapshot(function (snap) {
          visits = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; })
            .filter(function (v) { return isValidDate(v.date); });
          loaded = true;
          if (!snap.metadata.fromCache) { confirmed = true; clearTimeout(timer); setSync("Gemt", "ok"); }
          render();
        }, function () {
          clearTimeout(timer);
          setSync("Forbindelsen blev afbrudt. Genindlæs siden.", "warn");
        });
        db.doc("settings/main").onSnapshot(function (snap) {
          if (snap.exists) {
            var d = snap.data();
            settings = { rate: validNum(d.rate, DEFAULTS.rate), extra: validNum(d.extra, DEFAULTS.extra) };
          }
          syncSettingsInputs();
          render();
        }, function () {});
      },
      add: function (data) { return withRetry(function () { return db.collection("visits").doc().set(data); }); },
      update: function (id, patch) { return withRetry(function () { return db.doc("visits/" + id).update(patch); }); },
      remove: function (id) { return withRetry(function () { return db.doc("visits/" + id).delete(); }); },
      saveSettings: function (s) { return withRetry(function () { return db.doc("settings/main").set(s); }); }
    };
  }

  function localBackend() {
    var KEY = "rengoringstimer.v1";
    var state = { settings: Object.assign({}, DEFAULTS), visits: {} };
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === "object") {
          state.settings = { rate: validNum(p.settings && p.settings.rate, DEFAULTS.rate), extra: validNum(p.settings && p.settings.extra, DEFAULTS.extra) };
          state.visits = p.visits && typeof p.visits === "object" ? p.visits : {};
        }
      }
    } catch (e) { /* storage blocked: start empty */ }
    function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }
    function emit() {
      settings = Object.assign({}, state.settings);
      visits = Object.keys(state.visits).map(function (id) { var o = Object.assign({}, state.visits[id]); o.id = id; return o; })
        .filter(function (v) { return isValidDate(v.date); });
      loaded = true;
      syncSettingsInputs();
      render();
    }
    return {
      kind: "local",
      start: emit,
      add: function (data) {
        var id = "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        state.visits[id] = data; persist(); emit(); return Promise.resolve();
      },
      update: function (id, patch) {
        if (state.visits[id]) { state.visits[id] = Object.assign({}, state.visits[id], patch); persist(); emit(); }
        return Promise.resolve();
      },
      remove: function (id) { delete state.visits[id]; persist(); emit(); return Promise.resolve(); },
      saveSettings: function (s) { state.settings = Object.assign({}, s); persist(); emit(); return Promise.resolve(); }
    };
  }

  /* ---------- rendering ---------- */
  function visitItem(v) {
    var li = el("li", "visit-li");
    var b = el("button", "visit" + (v.id === editingId ? " editing" : ""));
    b.type = "button";
    var p = dateParts(v.date);
    var d = el("span", "v-date");
    d.append(el("span", "v-wd", p.wd), el("span", "v-dm", shortDate(v.date)));
    var mid = el("span", "v-mid");
    var w = worked(v);
    mid.append(el("span", "v-time", v.start + " – " + (v.end || "…")));
    if (w != null) mid.append(el("span", "v-calc", calcText(v)));
    else if (v.end) mid.append(el("span", "pill warn", "Tjek tiderne"));
    else mid.append(el("span", "pill warn", "I gang"));
    var amt = el("span", "v-amt", w != null ? fmt(amountOf(v)) + " kr" : "");
    b.append(d, mid, amt);
    b.addEventListener("click", function () { startEdit(v); });
    li.append(b);
    if (w == null && !v.end && !v.paid) {
      var q = el("button", "quick", "Slut nu");
      q.type = "button";
      q.addEventListener("click", function () { finishNow(v); });
      li.append(q);
    }
    return li;
  }

  function batchItem(key, list) {
    var det = el("details", "batch");
    if (openBatches.has(key)) det.open = true;
    det.addEventListener("toggle", function () { if (det.open) openBatches.add(key); else openBatches.delete(key); });
    var dates = list.map(function (v) { return v.date; }).sort();
    var range = dates[0] === dates[dates.length - 1] ? shortDate(dates[0]) : shortDate(dates[0]) + " – " + shortDate(dates[dates.length - 1]);
    var hrs = 0, kr = 0;
    list.forEach(function (v) { var b = billed(v); if (b != null) { hrs += b; kr += amountOf(v); } });
    var sum = el("summary");
    var top = el("span", "b-top");
    top.append(el("span", "pill ok", "Betalt"), el("span", "b-range", range));
    sum.append(top, el("span", "b-amt", fmt(kr) + " kr"), el("span", "b-sub", gange(list.length) + " · " + fmt(hrs) + " t"));
    det.append(sum);
    var ul = el("ul", "visits");
    list.slice().sort(byNewest).forEach(function (v) { ul.append(visitItem(v)); });
    det.append(ul);
    var foot = el("div", "b-foot");
    var undo = el("button", "linkbtn" + (undoArmed === key ? " armed" : ""), undoArmed === key ? "Tryk igen for at flytte tilbage" : "Flyt tilbage til ikke betalt");
    undo.type = "button";
    undo.addEventListener("click", function () { unpay(key, list); });
    foot.append(undo);
    det.append(foot);
    return det;
  }

  function render() {
    var open = visits.filter(function (v) { return !v.paid; }).sort(byNewest);
    var done = open.filter(function (v) { return billed(v) != null; });
    var running = open.length - done.length;
    var hrs = done.reduce(function (s, v) { return s + billed(v); }, 0);
    var kr = hrs * settings.rate;

    $("due-amount").textContent = fmt(kr);
    $("due-calc").textContent = done.length
      ? fmt(hrs) + " t × " + fmt(settings.rate) + " kr · " + gange(done.length)
      : "Ingen ubetalte timer";
    var note = $("open-note");
    note.hidden = !running;
    note.textContent = running ? gange(running) + " mangler sluttid og tælles med, når den er udfyldt." : "";
    var pay = $("pay-btn");
    pay.disabled = !done.length || !backend;
    if (!done.length) disarmPay();
    pay.classList.toggle("armed", payArmed);
    pay.textContent = payArmed ? "Tryk igen: " + fmt(kr) + " kr er betalt" : "Marker som betalt";

    var ul = $("open-list"), empty = $("open-empty");
    ul.replaceChildren();
    open.forEach(function (v) { ul.append(visitItem(v)); });
    ul.hidden = !open.length;
    empty.hidden = !!open.length;
    if (loaded) empty.textContent = "Alt er betalt. Tilføj næste gang i formularen ovenfor.";
    $("open-count").textContent = open.length ? gange(open.length) : "";

    var groups = new Map();
    visits.filter(function (v) { return v.paid; }).forEach(function (v) {
      var key = v.batch || v.paidAt || "betalt";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(v);
    });
    var keys = Array.from(groups.keys()).sort(function (a, b) {
      var ma = groups.get(a).map(function (v) { return v.date; }).sort().pop();
      var mb = groups.get(b).map(function (v) { return v.date; }).sort().pop();
      return mb.localeCompare(ma);
    });
    var paidList = $("paid-list");
    paidList.replaceChildren();
    keys.forEach(function (k) { paidList.append(batchItem(k, groups.get(k))); });
    $("paid-section").hidden = !keys.length;
    var paidN = visits.length - open.length;
    $("paid-count").textContent = paidN ? gange(paidN) : "";

    if (editingId && !visits.some(function (v) { return v.id === editingId; })) resetForm();
    $("f-submit").disabled = !backend;
    updatePreview();
  }

  /* ---------- settings ---------- */
  function syncSettingsInputs() {
    var r = $("rate"), x = $("extra-default");
    if (document.activeElement !== r) { r.value = plain(settings.rate); r.removeAttribute("aria-invalid"); }
    if (document.activeElement !== x) { x.value = plain(settings.extra); x.removeAttribute("aria-invalid"); }
  }
  var settingsTimer = null, settingsChain = Promise.resolve();
  function onSettingsInput() {
    var r = $("rate"), x = $("extra-default");
    var rate = parseNum(r.value), extra = parseNum(x.value);
    var okR = Number.isFinite(rate) && rate >= 0, okX = Number.isFinite(extra) && extra >= 0 && extra <= 24;
    r.setAttribute("aria-invalid", String(!okR));
    x.setAttribute("aria-invalid", String(!okX));
    if (!okR || !okX) return;
    var prevExtra = settings.extra;
    settings = { rate: rate, extra: extra };
    if (!editingId && parseNum($("f-extra").value) === prevExtra) $("f-extra").value = plain(extra);
    render();
    clearTimeout(settingsTimer);
    settingsTimer = setTimeout(function () {
      var snap = { rate: settings.rate, extra: settings.extra };
      settingsChain = settingsChain.then(function () { return backend && backend.saveSettings(snap); }).catch(writeError);
    }, 600);
  }
  ["rate", "extra-default"].forEach(function (id) {
    $(id).addEventListener("input", onSettingsInput);
    $(id).addEventListener("blur", function () { setTimeout(syncSettingsInputs, 0); });
  });

  /* ---------- form ---------- */
  function readForm() {
    var xs = $("f-extra").value;
    return { date: $("f-date").value, start: $("f-start").value, end: $("f-end").value, extra: xs.trim() === "" ? 0 : parseNum(xs) };
  }
  function validate(f) {
    if (!f.date) return "Vælg en dato.";
    if (!f.start) return "Skriv hvornår rengøringen startede under Kom.";
    if (!Number.isFinite(f.extra) || f.extra < 0) return "Ekstra skal være et tal, fx 1 eller 0,5.";
    if (f.end && toMin(f.end) <= toMin(f.start)) return "Gik skal være senere end Kom.";
    return null;
  }
  function showError(msg) { var e = $("f-error"); e.textContent = msg || ""; e.hidden = !msg; }
  function updatePreview() {
    var f = readForm(), p = $("f-preview");
    if (!f.start) { p.textContent = ""; return; }
    if (!f.end) { p.textContent = "Uden Gik gemmes den som i gang. Du kan tilføje sluttid senere."; return; }
    var s = toMin(f.start), e = toMin(f.end);
    if (e <= s || !Number.isFinite(f.extra) || f.extra < 0) { p.textContent = ""; return; }
    var w = (e - s) / 60, total = w + f.extra;
    var editing = editingId && visits.find(function (v) { return v.id === editingId; });
    var rate = editing ? rateOf(editing) : settings.rate;
    p.textContent = (f.extra ? fmt(w) + " t + " + fmt(f.extra) + " = " + fmt(total) + " t" : fmt(w) + " t") + "  ·  " + fmt(total * rate) + " kr";
  }
  function resetForm() {
    editingId = null;
    $("f-date").value = todayISO();
    $("f-start").value = "";
    $("f-end").value = "";
    $("f-extra").value = plain(settings.extra);
    $("form-title").textContent = "Ny gang";
    $("f-submit").textContent = "Tilføj";
    $("f-cancel").hidden = true;
    $("f-delete").hidden = true;
    disarmDelete();
    showError("");
    updatePreview();
  }
  function startEdit(v) {
    editingId = v.id;
    $("f-date").value = v.date;
    $("f-start").value = v.start || "";
    $("f-end").value = v.end || "";
    $("f-extra").value = plain(extraOf(v));
    $("form-title").textContent = "Ret gang " + dateParts(v.date).wd + " " + shortDate(v.date);
    $("f-submit").textContent = "Gem";
    $("f-cancel").hidden = false;
    $("f-delete").hidden = false;
    disarmDelete();
    showError("");
    render();
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("visit-form").closest(".card").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  }

  ["f-date", "f-start", "f-end", "f-extra"].forEach(function (id) {
    $(id).addEventListener("input", function () { showError(""); updatePreview(); });
    $(id).addEventListener("change", updatePreview);
  });
  document.querySelectorAll("[data-now]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      $(btn.getAttribute("data-now")).value = nowHM();
      if (!$("f-date").value) $("f-date").value = todayISO();
      showError("");
      updatePreview();
    });
  });

  $("visit-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!backend) return;
    var f = readForm(), err = validate(f);
    if (err) { showError(err); return; }
    var data = { date: f.date, start: f.start, end: f.end || "", extra: f.extra };
    var btn = $("f-submit");
    btn.disabled = true;
    var job = editingId
      ? backend.update(editingId, data).then(function () { toast("Ændringer gemt"); })
      : backend.add(Object.assign(data, { paid: false, createdAt: new Date().toISOString() })).then(function () { toast(data.end ? "Tilføjet" : "Tilføjet som i gang"); });
    job.then(resetForm, writeError).then(function () { btn.disabled = !backend; render(); });
  });
  $("f-cancel").addEventListener("click", function () { resetForm(); render(); });

  function disarmDelete() {
    delArmed = false; clearTimeout(delTimer);
    var d = $("f-delete"); d.classList.remove("armed"); d.textContent = "Slet";
  }
  $("f-delete").addEventListener("click", function () {
    if (!editingId || !backend) return;
    if (!delArmed) {
      delArmed = true;
      var d = $("f-delete"); d.classList.add("armed"); d.textContent = "Tryk igen for at slette";
      delTimer = setTimeout(disarmDelete, 4000);
      return;
    }
    var id = editingId;
    disarmDelete();
    backend.remove(id).then(function () { toast("Slettet"); resetForm(); render(); }, writeError);
  });

  function finishNow(v) {
    var end = nowHM();
    if (v.date !== todayISO() || toMin(end) <= toMin(v.start)) { startEdit(v); $("f-end").focus(); return; }
    backend.update(v.id, { end: end }).then(function () { toast("Sluttid " + end + " gemt"); }, writeError);
  }

  /* ---------- payments ---------- */
  function disarmPay() { payArmed = false; clearTimeout(payTimer); }
  $("pay-btn").addEventListener("click", function () {
    if (!backend) return;
    var targets = visits.filter(function (v) { return !v.paid && billed(v) != null; });
    if (!targets.length) return;
    if (!payArmed) {
      payArmed = true;
      payTimer = setTimeout(function () { payArmed = false; render(); }, 5000);
      render();
      return;
    }
    disarmPay();
    var total = targets.reduce(function (s, v) { return s + billed(v); }, 0) * settings.rate;
    var patch = { paid: true, paidAt: todayISO(), paidRate: settings.rate, batch: "b" + Date.now() };
    Promise.all(targets.map(function (v) { return backend.update(v.id, patch); }))
      .then(function () { toast(fmt(total) + " kr markeret som betalt"); }, writeError)
      .then(render);
  });

  function unpay(key, list) {
    if (!backend) return;
    if (undoArmed !== key) {
      undoArmed = key;
      clearTimeout(undoTimer);
      undoTimer = setTimeout(function () { undoArmed = null; render(); }, 4000);
      render();
      return;
    }
    undoArmed = null; clearTimeout(undoTimer);
    openBatches.delete(key);
    Promise.all(list.map(function (v) { return backend.update(v.id, { paid: false, paidAt: null, paidRate: null, batch: null }); }))
      .then(function () { toast("Flyttet tilbage til ikke betalt"); }, writeError)
      .then(render);
  }

  /* ---------- start ---------- */
  resetForm();
  render();
  var claude = window.claude;
  var ready = claude && typeof claude.use === "function"
    ? (setSync("Forbinder…"), Promise.resolve(claude.use("db")).catch(function () { return null; }))
    : Promise.resolve(null);
  ready.then(function (db) {
    backend = db ? dbBackend(db) : localBackend();
    if (!db) setSync("Gemmes kun i denne browser");
    backend.start();
    render();
  });
})();
</script>
